<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="SpeakCore – Self-Hosted Voice &amp; Community Platform">
  <title>SpeakCore</title>
  <defs>
    <linearGradient id="sc-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sc-bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#sc-grad)"/>

  <!-- zentrierte Komposition -->
  <g transform="translate(490 120) scale(3.6)">
    <path d="M32 5 L55.4 18.5 L55.4 45.5 L32 59 L8.6 45.5 L8.6 18.5 Z"
          fill="#111827" stroke="url(#sc-grad)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="32" cy="13.5" r="2.4" fill="#06B6D4"/>
    <circle cx="17" cy="42" r="2.4" fill="#2563EB"/>
    <circle cx="47" cy="42" r="2.4" fill="#06B6D4"/>
    <text x="32" y="42" text-anchor="middle"
          font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700"
          fill="url(#sc-grad)">S</text>
  </g>

  <text x="600" y="430" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-2">
    <tspan fill="#F8FAFC">Speak</tspan><tspan fill="#06B6D4">Core</tspan>
  </text>
  <text x="600" y="486" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="32" font-weight="500" fill="#94A3B8">Self-Hosted Voice &amp; Community Platform</text>
  <text x="600" y="536" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="22" font-weight="500" fill="#06B6D4" letter-spacing="3">CONTROL. CONNECT. COMMUNICATE.</text>
</svg>
